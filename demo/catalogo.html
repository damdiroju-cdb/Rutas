<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#123a6b">
<title>Catálogo 2026/27 · Demo</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="kit.css">
<style>
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.p{background:#fff;border-radius:18px;padding:12px;box-shadow:0 1px 6px rgba(18,32,51,.07);position:relative;display:flex;flex-direction:column}
.p img{width:100%;aspect-ratio:1;border-radius:14px}
.p b{font-size:14px;line-height:1.25;margin-top:8px}
.p small{color:#6b7a90;font-size:12px;margin-top:2px}
.p .pr{font-weight:900;color:#123a6b;font-size:16px;margin-top:6px}
.p .ctl{display:flex;justify-content:flex-end;margin-top:8px}
.p .plus{width:42px;height:42px;border-radius:21px;border:0;background:#22c55e;color:#fff;font-size:26px;font-weight:800;cursor:pointer}
.p .q{position:absolute;top:8px;right:8px;background:#f59e0b;color:#2a1700;font-weight:900;min-width:30px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;padding:0 6px}
</style></head>
<body>
<div class="w">
  <h1>Catálogo 2026/27</h1>
  <p class="sub">Con precios y pedido directo. Toca la foto para ver la ficha completa. El pedido llega a la oficina con el nombre del cliente.</p>
  <div class="chips" id="fams"></div>
  <div class="g" id="g"></div>
</div>
<div class="bar"><div class="in">
  <div style="flex:1"><div class="muted" id="bN">Carrito vacío</div><div style="font-weight:900;font-size:19px" id="bT">0,00 €</div></div>
  <button class="btn g" id="pedir" disabled>Hacer pedido</button>
</div></div>
<div class="modal" id="m" hidden><div class="sheet">
  <div style="display:flex;justify-content:space-between;align-items:center"><h3>Tu pedido</h3><button class="btn l" id="cerrar" style="padding:8px 14px">Cerrar</button></div>
  <div id="lines" style="margin:10px 0"></div>
  <div style="display:flex;justify-content:space-between;font-weight:900;font-size:19px;margin:8px 0 14px"><span>Total</span><span id="mT"></span></div>
  <input class="inp" id="nom" list="clis" placeholder="Nombre de tu negocio" autocomplete="off"><datalist id="clis"></datalist>
  <textarea class="inp" id="obs" rows="2" placeholder="Observaciones (opcional)" style="margin-top:10px"></textarea>
  <button class="btn g block" id="ok" style="margin-top:12px">Enviar pedido por WhatsApp</button>
  <p class="muted" style="text-align:center;margin:10px 0 0">En la demo el pedido llega al WhatsApp de David.</p>
</div></div>
<script src="kit.js"></script>
<script>
header('Catálogo con pedido directo');
const P=KIT.productos;let fam=0,cart=store.get('pedido',{});
$('#fams').innerHTML=KIT.familias.map((f,i)=>`<button class="chip${i===0?' on':''}" data-f="${i}">${f}</button>`).join('');
$('#fams').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;fam=+b.dataset.f;$$('#fams .chip').forEach(x=>x.classList.toggle('on',x===b));draw()};
$('#clis').innerHTML=KIT.clientes.map(c=>`<option value="${esc(c[0])}">`).join('');
const byCod=c=>P.find(p=>p[0]===c);
function draw(){$('#g').innerHTML=P.filter(p=>p[3]===fam).map(p=>`<div class="p">${cart[p[0]]?`<div class="q">${cart[p[0]]}</div>`:''}<img src="${prodImg(p)}" alt="${esc(p[1])}" data-f="${p[0]}"><b>${esc(p[1])}</b><small>${esc(p[2])}</small><div class="pr">${eur(p[4])}</div><div class="ctl"><button class="plus" data-c="${p[0]}" aria-label="Añadir">+</button></div></div>`).join('');sum()}
function sum(){let t=0,n=0;Object.entries(cart).forEach(([k,q])=>{t+=byCod(k)[4]*q;n+=q});$('#bN').textContent=n?n+(n===1?' caja':' cajas'):'Carrito vacío';$('#bT').textContent=eur(t);$('#pedir').disabled=!n;return t}
function addP(c){cart[c]=(cart[c]||0)+1;store.set('pedido',cart);draw()}
$('#g').onclick=e=>{const im=e.target.closest('img[data-f]');if(im){ficha(byCod(im.dataset.f),addP);return}const b=e.target.closest('[data-c]');if(!b)return;addP(b.dataset.c)};
function lines(){$('#lines').innerHTML=Object.entries(cart).map(([k,q])=>{const p=byCod(k);return `<div class="row"><img src="${prodImg(p)}" alt=""><div class="nm">${esc(p[1])}<small>${esc(p[2])}</small></div><div class="step"><button data-m="${k}">−</button><span>${q}</span><button data-p="${k}">+</button></div></div>`}).join('');$('#mT').textContent=eur(sum())}
$('#lines').onclick=e=>{const m=e.target.dataset.m,p=e.target.dataset.p;if(p)cart[p]++;else if(m){cart[m]--;if(cart[m]<=0)delete cart[m]}else return;store.set('pedido',cart);if(!Object.keys(cart).length){$('#m').hidden=true;draw()}else lines()};
$('#pedir').onclick=()=>{lines();$('#m').hidden=false};
$('#cerrar').onclick=()=>{$('#m').hidden=true;draw()};
$('#ok').onclick=()=>{const nom=$('#nom').value.trim();if(!nom){$('#nom').focus();toast('Pon el nombre de tu negocio');return}
  const t=sum();const txt='*NUEVO PEDIDO · '+KIT.marca+'*\nCliente: '+nom+'\nOrigen: catálogo 2026/27\n\n'+Object.entries(cart).map(([k,q])=>{const p=byCod(k);return '• '+q+' × '+p[1]+' ('+p[2]+')'}).join('\n')+'\n\nTotal aprox.: '+eur(t)+' + IVA'+($('#obs').value.trim()?'\nObs.: '+$('#obs').value.trim():'');
  logAct('pedido','Pedido de '+nom+' desde catálogo · '+eur(t));
  window.open('https://wa.me/'+KIT.contacto.wa+'?text='+encodeURIComponent(txt),'_blank');
  cart={};store.set('pedido',cart);$('#m').hidden=true;$('#obs').value='';draw();toast('Pedido enviado ✓')};
draw();
</script>
</body></html>
