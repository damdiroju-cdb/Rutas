<style>
:root{--red:#D2000F;--blue:#0067B1;--blue2:#00518c;--ink:#14213d;--mut:#5b6474;--line:#e3e7ee;--soft:#f4f6fa;--ok:#1a9c4b;--okbg:#e7f6ec;--ko:#c2410c;--kobg:#fff1e8;--wa:#25D366}
*{box-sizing:border-box}
html,body{margin:0;background:var(--soft);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}
[hidden]{display:none!important}
header{background:var(--blue);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 0;position:sticky;top:0;z-index:20}
.hrow{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto}
.hrow img{height:28px}
.hrow .nw{height:22px}
.hrow h1{font-size:18px;margin:0 0 0 auto;font-weight:800;text-align:right}
.hrow h1 small{display:block;font-weight:500;font-size:12px;opacity:.85}
nav{display:flex;gap:6px;max-width:1100px;margin:10px auto 0;overflow-x:auto;scrollbar-width:none}
nav button{flex:0 0 auto;border:0;border-radius:12px 12px 0 0;padding:11px 16px;font-weight:800;background:rgba(255,255,255,.16);color:#fff;cursor:pointer}
nav button[aria-selected=true]{background:var(--soft);color:var(--blue)}
main{max-width:1100px;margin:0 auto;padding:16px 12px 60px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.filters label{font-weight:700;font-size:14px;color:var(--mut)}
select,input[type=text],input[type=search],input[type=date],input[type=password],input[type=tel]{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-size:16px;color:var(--ink);min-width:0}
.seg{display:inline-flex;background:#fff;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:none;padding:9px 14px;font-weight:700;cursor:pointer;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--blue);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 1px 3px rgba(20,33,61,.07)}
.kpi .l{font-size:13px;font-weight:700;color:var(--mut)}
.kpi .v{font-size:28px;font-weight:800;line-height:1.15;margin-top:4px}
.kpi .s{font-size:13px;color:var(--mut)}
.kpi.ok .v{color:var(--ok)}.kpi.ko .v{color:var(--ko)}
.up{color:var(--ok);font-weight:800}.down{color:var(--ko);font-weight:800}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(20,33,61,.07);margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:19px}
.card .help{color:var(--mut);font-size:14px;margin:0 0 12px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover{background:#f7f9fc}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.ko{background:var(--kobg);color:var(--ko)}.pill.nu{background:#eef1f6;color:var(--mut)}
.bar{height:10px;background:#eef1f6;border-radius:6px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--ok)}
.sub{color:var(--mut);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.big{padding:14px 18px;font-size:17px}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:6px 10px;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.step{display:flex;gap:14px;align-items:flex-start;border-top:1px solid var(--line);padding:16px 0}
.step:first-of-type{border-top:0}
.num{flex:0 0 36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.step .body{flex:1;min-width:0}
.step h3{margin:4px 0 6px;font-size:17px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop{display:block;border:3px dashed var(--line);border-radius:16px;padding:18px;text-align:center;background:var(--soft);cursor:pointer;font-weight:700;color:var(--mut)}
.drop:hover{border-color:var(--blue);color:var(--blue)}
.drop input{display:none}
.msg{margin-top:10px;padding:12px 14px;border-radius:12px;font-size:15px}
.msg.ok{background:var(--okbg);color:#0f5c2c}.msg.ko{background:var(--kobg);color:#7c2d12}.msg.in{background:#e9f4ff;color:var(--blue2)}
.radio{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.radio label{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:12px;padding:10px 12px;cursor:pointer}
.radio input{margin-top:4px;width:18px;height:18px}
.modal{position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:760px){.modal{align-items:center}.modal .box{border-radius:20px}}
.box h2{margin:0 0 2px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.lock{position:fixed;inset:0;background:var(--blue);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.lock form{background:#fff;border-radius:20px;padding:24px;max-width:400px;width:100%}
.lock h2{margin:.2em 0}
.lock input{width:100%;margin:10px 0;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.empty{text-align:center;color:var(--mut);padding:24px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:99;font-weight:700}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.85);z-index:95;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-weight:800;font-size:18px;text-align:center;padding:20px}
.spin{width:46px;height:46px;border:5px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.link{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--mut);word-break:break-all}
ol.howto{padding-left:20px;margin:6px 0}ol.howto li{margin:4px 0}
@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:23px}.hm{display:none}.grid2{grid-template-columns:1fr}.hrow h1{font-size:15px}}
</style>
</head>
<body>
<header>
  <div class="hrow"><img src="../catalogo/penalva_blanco.png" alt="Penalva"><img class="nw" src="../catalogo/nordwik_blanco.png" alt="Nordwik"><h1 id="hTitle">Cuadro de ventas<small id="hSub"></small></h1></div>
  <div class="hrow" style="justify-content:flex-end;margin-top:6px"><button id="outBtn" class="btn" style="background:rgba(255,255,255,.18);border-color:transparent;color:#fff;margin-right:8px" hidden>🔒 Cerrar sesión</button><button id="libBtn" class="btn" style="background:#D2000F;border-color:#D2000F;color:#fff;margin-right:8px;font-weight:800">📚 Catálogos</button><button id="instBtn" class="btn" style="background:#fff;border-color:#fff;color:#0067B1" hidden>📌 Ponerlo en mi escritorio</button></div>
  <nav id="nav" role="tablist">
    <button data-v="res" aria-selected="true">📊 Resumen</button>

</header>
<main>
  <div class="filters" id="filters">
    <label for="fRep">Comercial</label><select id="fRep"></select>
    <div class="seg" id="fPer"><button data-p="ult" aria-pressed="true">Última semana</button><button data-p="tot" aria-pressed="false">Desde 1 ago</button></div>
  </div>
  <section id="v-res"></section>
  <section id="v-cli" hidden></section>
  <section id="v-car" hidden></section>
  <section id="v-enl" hidden></section>
</main>
<div class="modal" id="modal" hidden><div class="box" id="mbox"></div></div>
<div class="lock" id="lock" hidden><form id="lockF">
  <h2>Cuadro de ventas</h2>
  <p class="sub">Escribe la <b>clave de carga</b>. Solo te la pide la primera vez en este aparato.</p>
  <input type="text" id="lockK" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="PNV-XXXX-XXXX-XXXX" required>
  <div class="msg ko" id="lockM" hidden></div>
  <button class="btn pri big" style="width:100%" id="lockB">Entrar</button>
  <p class="sub" style="margin-bottom:0">¿Eres comercial? Entra con el enlace que te ha mandado David.</p>
</form></div>
<div class="lock" id="pinbox" hidden><form id="pinF" autocomplete="off">
  <h2 id="pinT">Cuadro de ventas</h2>
  <p class="sub" id="pinS"></p>
  <input type="password" id="pinI" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="····" style="font-size:30px;letter-spacing:14px;text-align:center">
  <input type="password" id="pinI2" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="Repite el PIN" style="font-size:22px;letter-spacing:8px;text-align:center;margin-top:8px" hidden>
  <div class="msg ko" id="pinM" hidden></div>
  <button class="btn pri big" style="width:100%" id="pinB">Entrar</button>
  <p class="sub" style="margin-bottom:0;text-align:center"><a href="#" id="pinOlv">¿Has olvidado tu PIN?</a></p>
</form></div>
<div class="busy" id="busy" hidden><div class="spin"></div><div id="busyT">Cargando…</div></div>
<div class="toast" id="toast" hidden></div>

<script src="xlsx.full.min.js"></script>
<script src="nucleo.js?v=5"></script>
<script>
(async function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=(n,d)=>(Math.round(n*(d?100:1))/(d?100:1)).toLocaleString('es-ES',{minimumFractionDigits:d?2:0,maximumFractionDigits:d?2:0})+' €';
const pct=(a,b)=>b>0?Math.round((a-b)/b*100):null;
const pctH=p=>p==null?'<span class="sub">—</span>':`<span class="${p>=0?'up':'down'}">${p>=0?'▲':'▼'} ${Math.abs(p)} %</span>`;
const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}},put=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
const toast=t=>{const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)};
const busy=t=>{$('busy').hidden=!t;if(t)$('busyT').textContent=t};
const NOREP='(sin comercial asignado)';

let SESS='';
let ST=null,K=null,DASH=null,ADMIN=false,VIEW='res',PER='ult',REP='',CF='todos',CQ='',CCAN='';
const params=new URLSearchParams(location.search);
  $('libBtn').onclick=()=>{const c=(SESS&&SESS!=='todos')?SESS:(get('pnv_vrep')||'');location.href='../catalogo/biblioteca/?'+(c?'c='+encodeURIComponent(c)+'&':'')+'volver='+encodeURIComponent(location.pathname+location.search)};
// ---- acceso ----
async function entrarClave(clave){
  K=await NV.claves(clave);DASH=K.dash;ADMIN=true;
  const st=await NV.abrirDatos(DASH);
  put('pnv_vclave',clave.trim().toUpperCase());
  return st;
}
const NOMBRE=s=>s==='todos'?'todos los comerciales':s.split('-').map(w=>w[0].toUpperCase()+w.slice(1)).join(' ');
let PINMODO='',PINDASH='';
function pedirPin(cs,modo){
  PINMODO=modo||(get('pnv_pin_'+cs)?'pin':'primera');
  $('pinbox').hidden=false;$('pinM').hidden=true;$('pinI').value='';$('pinI2').value='';$('pinI2').hidden=PINMODO!=='nuevo';
  $('pinOlv').parentNode.hidden=PINMODO!=='pin';
  $('pinT').textContent=cs==='todos'?'Cuadro de ventas':'Hola, '+NOMBRE(cs)+' 👋';
  $('pinS').innerHTML=PINMODO==='primera'?'Es la primera vez en este aparato. Escribe el PIN <b>0000</b>.'
    :PINMODO==='nuevo'?'Ahora <b>crea tu PIN</b> de 4 cifras (que no sea 0000) y repítelo. Te lo pedirá solo si cierras la sesión.'
    :'Escribe tu PIN de 4 cifras.';
  $('pinB').textContent=PINMODO==='nuevo'?'Guardar mi PIN':'Entrar';
  setTimeout(()=>$('pinI').focus(),50);
}
async function entrarPin(cs,dashB64){
  put('pnv_open_'+cs,dashB64);put('pnv_lastc',cs);SESS=cs;DASH=NV.unb64(dashB64);busy('Cargando ventas…');
  ST=await NV.abrirDatos(DASH);$('pinbox').hidden=true;$('outBtn').hidden=false;busy(false);if(cs!=='todos')VIEW='cli';iniciar();
}
$('pinF').addEventListener('submit',async e=>{e.preventDefault();const cs=params.get('c');const v=$('pinI').value.trim();const M=$('pinM');M.hidden=true;
  const err=t=>{M.textContent=t;M.hidden=false;busy(false)};
  if(!/^\d{4}$/.test(v))return err('El PIN son 4 números.');
  try{
    if(PINMODO==='primera'){
      if(v!==NV.PIN0)return err('La primera vez el PIN es 0000.');
      busy('Comprobando…');const r=await fetch('acc/'+encodeURIComponent(cs)+'.bin?_='+Date.now(),{cache:'no-store'});
      if(!r.ok)return err('Este enlace no es válido. Pide el tuyo a David.');
      PINDASH=await NV.pinAbrir(v,cs,NV.unb64((await r.text()).trim()));busy(false);pedirPin(cs,'nuevo');
    }else if(PINMODO==='nuevo'){
      const v2=$('pinI2').value.trim();
      if(v===NV.PIN0)return err('Elige un PIN distinto de 0000.');
      if(v!==v2)return err('Los dos PIN no coinciden.');
      busy('Guardando tu PIN…');put('pnv_pin_'+cs,NV.b64url(await NV.pinCerrar(v,cs,PINDASH)));PINDASH='';
      toast('PIN guardado ✔');await entrarPin(cs,await NV.pinAbrir(v,cs,NV.unb64(get('pnv_pin_'+cs))));if(!instalada())setTimeout(instalar,700);
    }else{
      busy('Comprobando…');let d;try{d=await NV.pinAbrir(v,cs,NV.unb64(get('pnv_pin_'+cs)))}catch(x){return err('PIN incorrecto.')}
      await entrarPin(cs,d);
    }
  }catch(x){console.error(x);err('No se ha podido entrar. Revisa la conexión y prueba otra vez.')}
});
$('pinOlv').onclick=e=>{e.preventDefault();if(!confirm('¿Has olvidado tu PIN? Vuelve a entrar con 0000 y crea uno nuevo.'))return;const cs=params.get('c');put('pnv_pin_'+cs,null);pedirPin(cs,'primera')};
$('outBtn').onclick=()=>{if(!confirm('¿Cerrar sesión? Para volver a entrar te pedirá tu PIN.'))return;if(SESS)put('pnv_open_'+SESS,null);put('pnv_vdash',null);put('pnv_vrep',null);location.href=location.pathname+(SESS?'?c='+SESS:'')};
async function arrancar(){
  const hv=(location.hash.match(/v=([^&]+)/)||[])[1];
  const cs=params.get('c');
  if(!hv&&!cs&&!get('pnv_vclave')&&get('pnv_lastc')){location.replace(location.pathname+'?c='+encodeURIComponent(get('pnv_lastc')));return}
  if(!hv&&cs&&!get('pnv_vclave')){
    const op=get('pnv_open_'+cs);
    if(op){try{await entrarPin(cs,op);return}catch(e){console.error(e);put('pnv_open_'+cs,null)}}
    busy(false);pedirPin(cs);return;
  }
  try{
    if(hv){DASH=NV.unb64(decodeURIComponent(hv));busy('Cargando ventas…');ST=await NV.abrirDatos(DASH);put('pnv_vdash',hv);}
    else if(get('pnv_vclave')){busy('Cargando ventas…');ST=await entrarClave(get('pnv_vclave'))}
    else if(get('pnv_vdash')){DASH=NV.unb64(get('pnv_vdash'));busy('Cargando ventas…');ST=await NV.abrirDatos(DASH)}
    else{busy(false);$('lock').hidden=false;return}
  }catch(e){console.error(e);busy(false);put('pnv_vdash',null);$('lock').hidden=false;$('lockM').hidden=false;$('lockM').textContent='No se han podido abrir los datos. Escribe la clave o pide el enlace de nuevo.';return}
  busy(false);iniciar();
}
$('lockF').addEventListener('submit',async e=>{e.preventDefault();$('lockB').disabled=true;$('lockM').hidden=true;busy('Comprobando la clave…');
  try{ST=await entrarClave($('lockK').value);$('lock').hidden=true;busy(false);iniciar()}
  catch(err){console.error(err);busy(false);put('pnv_vclave',null);ADMIN=false;$('lockM').hidden=false;$('lockM').textContent='Clave incorrecta.'}finally{$('lockB').disabled=false}});

// ---- cálculos ----
let AG=null;
function calcular(){
  const P=ST?ST.periodos:[];const last=P[P.length-1];
  const n=ST?ST.cli.length:0;
  const tot=new Float64Array(n),totp=new Float64Array(n),ult=new Float64Array(n),ultp=new Float64Array(n),antes=new Float64Array(n);
  P.forEach((p,pi)=>{const r=p.rows,isL=pi===P.length-1;for(let i=0;i<r.length;i+=4){const c=r[i];tot[c]+=r[i+2];totp[c]+=r[i+3];if(isL){ult[c]+=r[i+2];ultp[c]+=r[i+3]}else antes[c]+=r[i+2]}});
  AG={last,tot,totp,ult,ultp,antes,nper:P.length};
}
const repOf=c=>c.com||NOREP;
function visibles(){if(!ST)return[];return ST.cli.map((c,i)=>i).filter(i=>!NV.fuera(ST.cli[i])&&(!REP||repOf(ST.cli[i])===REP))}
const pidio=i=>AG.ult[i]>0.005;
const habitual=i=>AG.nper>1?AG.antes[i]>0.005:AG.tot[i]>0.005;

// ---- vistas ----
function iniciar(){
  document.querySelectorAll('[data-admin]').forEach(b=>b.hidden=!ADMIN);
  if(!ST){$('hSub').textContent='Todavía no hay datos cargados';VIEW=ADMIN?'car':'res'}
  else{calcular();$('hSub').textContent=`Ventas del ${NV.fmtD(ST.inicio)} al ${NV.fmtD(AG.last.hasta)}`}
  // comercial: por enlace ?c=slug
  const reps=ST?[...new Set(ST.cli.filter(c=>!NV.fuera(c)).map(repOf))].sort((a,b)=>a===NOREP?1:b===NOREP?-1:a.localeCompare(b,'es')):[];
  if(params.get('c')&&params.get('c')!=='todos')put('pnv_vrep',params.get('c'));const want=SESS==='todos'?null:(params.get('c')||(ADMIN?null:get('pnv_vrep')));
  if(want){const r=reps.find(x=>NV.slug(x)===want)||reps.find(x=>NV.slug(x).includes(want));if(r)REP=r}
  const reps2=reps;$('fRep').innerHTML=`<option value="">Todos los comerciales</option>`+reps.map(r=>`<option${r===REP?' selected':''}>${esc(r)}</option>`).join('');

  const sugDesde=last?NV.addDays(last,1):ST?ST.inicio:NV.INICIO;
  $('pV').innerHTML=`<div class="msg ok">✔ <b>${esc(PV.file)}</b>: ${Object.keys(PV.cli).length} clientes, ${PV.rows.length} líneas, venta ${PV.year}: <b>${eur(tot)}</b> (${cs} clientes con compra).</div>
  <div class="radio"><label><input type="radio" name="modo" value="acumulado" ${last?'checked':''}><span><b>Es desde el 1 de agosto hasta hoy</b> (acumulado)<br><span class="sub">Calculo yo solo lo nuevo desde la última carga.</span></span></label>
  <label><input type="radio" name="modo" value="periodo" ${last?'':'checked'}><span><b>Son solo las ventas de unos días</b><br><span class="sub">Se suman tal cual.</span></span></label></div>
  <div class="grid2"><div><label class="sub" for="d1"><b>Desde</b></label><br><input type="date" id="d1" value="${sugDesde}" style="width:100%"></div><div><label class="sub" for="d2"><b>Hasta</b></label><br><input type="date" id="d2" value="${hoy}" style="width:100%"></div></div>`;
  const sync=()=>{const m=document.querySelector('input[name=modo]:checked').value;if(m==='acumulado'){$('d1').value=ST?ST.inicio:NV.INICIO;$('d1').disabled=true}else{$('d1').disabled=false;$('d1').value=sugDesde}};
  document.querySelectorAll('input[name=modo]').forEach(r=>r.onchange=sync);sync();
}
async function publicar(){
  const M=$('pM');M.innerHTML='';
  const tok=get('pnv_gh');if(!tok){M.innerHTML='<div class="msg ko">Falta la llave de GitHub (más abajo).</div>';return}
  const st=ST?JSON.parse(JSON.stringify(ST)):NV.nuevoEstado();
  let res=[];
  try{
    if(PV){const modo=document.querySelector('input[name=modo]:checked').value;const r=NV.cargarVentas(st,PV,$('d1').value,$('d2').value,modo);res.push(`Ventas del ${NV.fmtD(r.desde)} al ${NV.fmtD(r.hasta)}: ${eur(r.total)} · ${r.clientes} clientes con compra`)}
    if(PC){const r=NV.cargarClientes(st,PC);res.push(`Clientes: ${r.clientes} (${r.conComercial} con comercial, ${r.conMovil} con móvil)`)}
    if(!st.periodos.length)throw new Error('Primero elige el Excel de ventas (paso 1).');
    st.envio=document.querySelector('input[name=env]:checked').value;
    st.central=NV.tel($('central').value)||NV.CENTRAL;
    document.querySelectorAll('[data-rp]').forEach(i=>{st.reps[i.dataset.rp]=NV.tel(i.value)});
    busy('Preparando la tarifa…');const T=await NV.tarifa();
    busy('Preparando los enlaces de '+st.cli.length+' clientes…');
    const files=await NV.construir(st,K,T);
    await NV.publicar(tok,files,'Ventas: '+(res[0]||'ajustes')+' (panel)',t=>busy(t));
    ST=st;PV=null;PC=null;calcular();busy(false);
    carga();$('pM').innerHTML=`<div class="msg ok">✅ <b>Publicado.</b> ${res.map(esc).join('<br>')}<br><span class="sub">Tarda 1–2 minutos en verse en todos los móviles.</span></div>`;
    $('hSub').textContent=`Ventas del ${NV.fmtD(ST.inicio)} al ${NV.fmtD(AG.last.hasta)}`;
  }catch(e){console.error(e);busy(false);M.innerHTML=`<div class="msg ko">${esc(e.message||e)}</div>`}
}
const MSGREP=(n,u)=>`Hola${n&&n!=='Todos los comerciales'?' '+n.split(' ')[0]:''}, este es tu *Cuadro de ventas de Penalva*, con tus clientes:
${u}

*1. Entrar*
Abre el enlace y escribe el PIN *0000*. Te pedirá crear tu PIN de 4 números: invéntate uno y repítelo. Ya estás dentro.

*2. Ponerlo en el móvil como una app*
• *Android:* abre el enlace en Chrome, toca los 3 puntitos ⋮ de arriba a la derecha → «Instalar aplicación» (o «Añadir a pantalla de inicio») → «Instalar».
• *iPhone:* abre el enlace en Safari, toca el botón Compartir (cuadrado con flecha ⬆️) → «Añadir a pantalla de inicio» → «Añadir».
• *Ordenador:* ábrelo en Chrome y toca el iconito de instalar 🖥️ que sale a la derecha de la barra de direcciones.
Te queda un icono azul de Penalva. Desde ahí entras siempre.

*3. Usarlo*
En «Clientes» busca al cliente y toca el botón verde: le llega por WhatsApp su enlace con lo que suele comprar, elige y te manda el pedido.

Si cierras sesión te pedirá tu PIN. Si lo olvidas, toca «¿Has olvidado tu PIN?» y vuelve a entrar con 0000.`;
function enlaces(){
  const V=$('v-enl');
  const dk=encodeURIComponent(NV.b64url(DASH));
  const base=NV.LINK_BASE+'ventas/';
  const reps=ST?[...new Set(ST.cli.map(c=>c.com).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es')):[];
  const row=(n,u,tel)=>{const t=MSGREP(n,u);
    return`<tr><td><b>${esc(n)}</b><div class="link">${esc(u)}</div></td><td><div class="acts" style="margin:0"><button class="btn sm" data-copy="${esc(t)}">Copiar mensaje</button><a class="btn sm wa" target="_blank" rel="noopener" href="https://wa.me/${tel?'34'+esc(tel):''}?text=${encodeURIComponent(t)}">WhatsApp</a></div></td></tr>`};
  V.innerHTML=`<div class="card"><h2>Enlaces del cuadro de ventas</h2><p class="help">Cada comercial entra a <b>sus</b> clientes. La primera vez el PIN es <b>0000</b> y le pide crear el suyo. Si alguien olvida el PIN, toca «¿Has olvidado tu PIN?» y vuelve a entrar con 0000.</p><div class="tw"><table><tbody>
  ${row('Todos los comerciales',base+'?c=todos','')}
  ${reps.map(n=>row(n,base+'?c='+NV.slug(n),ST.reps[n])).join('')}
  </tbody></table></div>${reps.length?'':'<div class="msg in">Cuando cargues el listado de clientes con su comercial, aquí saldrá el enlace de cada uno.</div>'}</div>`;
}

// ---- icono en el escritorio / pantalla de inicio ----
let DEFER=null;
const instalada=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFER=e});
window.addEventListener('appinstalled',()=>{$('instBtn').hidden=true;toast('¡Listo! Ya lo tienes en el escritorio ✔')});
function atajo(){
  const dk=get('pnv_vdash')||(DASH?encodeURIComponent(NV.b64url(DASH)):'');
  const rep=REP&&REP!==NOREP?'?c='+NV.slug(REP):'';
  const url=NV.LINK_BASE+'ventas/'+(ADMIN?'':(SESS?'?c='+SESS:rep+(dk?'#v='+dk:'')));
  const txt='[InternetShortcut]\r\nURL='+url+'\r\nIconIndex=0\r\nIconFile='+NV.LINK_BASE+'ventas/img/icon.ico\r\n';
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/octet-stream'}));a.download='Cuadro de ventas Penalva.url';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
async function instalar(){
  if(DEFER){DEFER.prompt();const r=await DEFER.userChoice.catch(()=>({}));DEFER=null;if(r&&r.outcome==='accepted')return}
  const ua=navigator.userAgent,ios=/iPhone|iPad|iPod/.test(ua),and=/Android/.test(ua);
  $('mbox').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-start"><h2>📌 Ponlo en tu móvil como una app</h2><button class="btn sm" id="mclose">✕</button></div>
  ${ios?`<ol class="howto" style="font-size:17px"><li>Abre esta página en <b>Safari</b>.</li><li>Toca el botón <b>Compartir</b> (el cuadrado con la flecha hacia arriba ⬆️).</li><li>Baja y toca <b>«Añadir a pantalla de inicio»</b>.</li><li>Toca <b>«Añadir»</b>. Te sale el icono azul en el móvil.</li></ol>`:
  and?`<ol class="howto" style="font-size:17px"><li>Toca los <b>tres puntitos ⋮</b> de arriba a la derecha de Chrome.</li><li>Toca <b>«Instalar aplicación»</b> o <b>«Añadir a pantalla de inicio»</b>.</li><li>Toca <b>«Instalar»</b>. Te sale el icono azul en el móvil.</li></ol>`:
  `<p><b>Opción 1 (la mejor):</b> en Chrome o Edge, toca el iconito de <b>instalar</b> 🖥️⬇️ que sale a la derecha de la barra de direcciones, o menú ⋮ → <b>«Enviar, guardar y compartir» → «Instalar página como aplicación»</b> (en Edge: ⋯ → <b>Aplicaciones → Instalar este sitio como aplicación</b>). Te queda el icono en el escritorio y se abre como un programa.</p>
  <p><b>Opción 2:</b> descarga un acceso directo y arrástralo al escritorio.</p><div class="acts"><button class="btn pri big" id="dlUrl">⬇️ Descargar acceso directo</button></div>`}
  <p class="sub">Desde el icono entras directo. Si cierras sesión, te pedirá tu PIN.</p>`;
  $('modal').hidden=false;
  if($('dlUrl'))$('dlUrl').onclick=atajo;
}
$('instBtn').onclick=instalar;
if(!instalada())$('instBtn').hidden=false;
arrancar();
})();
